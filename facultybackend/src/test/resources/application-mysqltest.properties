# ============================================================
# Phase 3.1 Step 3 — dedicated MySQL test profile ("mysqltest")
#
# ISOLATION GUARANTEES:
#   * The JDBC URL is hard-coded to the disposable Docker MySQL
#     instance on localhost:33071 and the isolated database
#     college_attendance_ph31test. This profile NEVER inherits
#     DB_URL / DB_USERNAME / DB_PASSWORD (or any other
#     production datasource setting): no placeholders are
#     referenced here, so profile-specific values referenced
#     below always override spring.config.import or the
#     production defaults in application.properties.
#   * Port 3307 (the college database) is never addressed from
#     this profile.
#   * Test-only credentials that exist solely in the disposable
#     container; they are meaningless anywhere else.
#   * ddl-auto=create-drop is used ONLY in this profile — the
#     schema is dropped when the test context closes, leaving
#     the database empty.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:33071/college_attendance_ph31test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ph31testuser
spring.datasource.password=ph31_test_user_pw

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SMTP is stubbed in tests (StubEmailConfiguration replaces EmailService)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test-user
spring.mail.password=

app.jwt.secret=TEST_ONLY_FAKE_JWT_SECRET_FOR_LOCAL_AUTOMATED_TESTS_2026
app.jwt.expiration-ms=3600000
app.jwt.issuer=faculty-backend-mysqltest

app.frontend.url=http://localhost:3000
app.leave.approval-base-url=http://localhost/api/leave/approve
app.mail.sender-email=noreply@test.local
app.mail.sender-name=Faculty Sync Tracker MySQL Test

face-verification.service-url=http://localhost:59999
face-verification.internal-secret=test-internal-service-secret

logging.level.com.college.attendance=WARN
logging.level.org.springframework.security=WARN

app.upload.dir=target/mysqltest-uploads/profile-pictures
