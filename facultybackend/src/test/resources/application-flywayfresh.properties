# ============================================================
# Phase 6 Plan 06-01: Gated Disposable MySQL Flyway Test Profile
#
# ISOLATION GUARANTEES:
#   * Targets ONLY disposable Docker MySQL on port 33071.
#   * Database: college_attendance_flywayfresh
#   * NEVER connects to port 3307 or college_attendance.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:33071/college_attendance_flywayfresh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ph31testuser
spring.datasource.password=ph31_test_user_pw

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing ddl-auto=update schema (pre-Flyway era)
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test-user
spring.mail.password=

app.jwt.secret=TEST_ONLY_FAKE_JWT_SECRET_FOR_LOCAL_AUTOMATED_TESTS_2026
app.jwt.expiration-ms=3600000
app.jwt.issuer=faculty-backend-flywaytest

app.frontend.url=http://localhost:3000
app.leave.approval-base-url=http://localhost/api/leave/approve
app.mail.sender-email=noreply@test.local
app.mail.sender-name=Faculty Sync Tracker Flyway Test

face-verification.service-url=http://localhost:59999
face-verification.internal-secret=test-internal-service-secret

logging.level.com.college.attendance=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

app.upload.dir=target/flywaytest-uploads/profile-pictures
