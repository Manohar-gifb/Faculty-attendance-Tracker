# ============================================================
# Test profile — in-memory H2, no external dependencies
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SMTP is mocked in tests (EmailService is replaced with a @MockBean)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test-user
spring.mail.password=

app.jwt.secret=TEST_ONLY_FAKE_JWT_SECRET_FOR_LOCAL_AUTOMATED_TESTS_2026
app.jwt.expiration-ms=3600000
app.jwt.issuer=faculty-backend-test

app.developer.email=admin@test.local
app.developer.password=Dev@12345
app.developer.employee-id=DEV001

app.frontend.url=http://localhost:3000
app.leave.approval-base-url=http://localhost/api/leave/approve
app.mail.sender-email=noreply@test.local
app.mail.sender-name=Faculty Sync Tracker Test

face-verification.service-url=http://localhost:59999
face-verification.internal-secret=test-internal-service-secret

logging.level.com.college.attendance=WARN
logging.level.org.springframework.security=WARN

app.upload.dir=target/test-uploads/profile-pictures

# Mirror the production multipart limits so upload-size behavior in tests
# matches application.properties (FILE-01: 5 MB limit).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.college.latitude=12.9716
app.college.longitude=77.5946
app.college.radius-meters=3800
app.college.max-accuracy-meters=150
