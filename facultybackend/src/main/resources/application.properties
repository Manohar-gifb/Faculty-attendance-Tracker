# ============================================================
# Server Configuration
# ============================================================
server.port=8081
server.servlet.context-path=/api

# ============================================================
# Local secrets: load facultybackend/.env (MAIL_USERNAME, MAIL_PASSWORD,
# FRONTEND_URL, ...) so the backend can send activation emails without
# exporting shell variables. Real OS environment variables always take
# precedence over this file, so production stays env-var driven.
# ============================================================
spring.config.import=optional:file:./.env

# ============================================================
# MySQL Database Configuration
# Override with environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/college_attendance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# ddl-auto default stays UPDATE (pre-Flyway behavior). When an operator opts
# into Flyway (spring.flyway.enabled=true), set DDL_AUTO=validate so Hibernate
# stops managing the schema and instead VERIFIES it against the entities.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Flyway versioned migrations (06-01) — SAFE ADOPTION
#
# DISABLED BY DEFAULT: the application keeps booting exactly as
# before, with Hibernate ddl-auto=update managing the schema.
#
# When an operator opts in (spring.flyway.enabled=true), the
# behavior is intentionally conservative:
#   * baseline-on-migrate=true with baseline-version=1 records an
#     EXISTING populated database as baseline version 1 — V1 itself
#     is NEVER executed against live data (no blind DDL), only
#     future versions (V2+) apply incrementally.
#   * For FRESH installations on an empty database, V1 builds the
#     full schema from the committed baseline.
#   * validate-on-migrate=true fail-fast on checksum mismatch.
#
# Full procedure (fresh + existing installs + recovery):
#   database/migrations/README.md
# ============================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing ddl-auto=update schema (pre-Flyway era)
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# JWT Configuration
# Override the secret in production with the JWT_SECRET env var.
# ============================================================
app.jwt.secret=${JWT_SECRET:ZmVsdHliYWNrZW5kYXR0ZW5kYW5kbWFuYWdlbWVudHN5c3RlbXNlY3JldGtleTIwMjRzdXBlcnNlY3VyZQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=faculty-backend

# ============================================================
# Email Configuration (SMTP - Gmail)
# SMTP credentials come from env vars MAIL_USERNAME / MAIL_PASSWORD.
# Empty defaults let the app start without SMTP; email failures are
# reported to the caller instead of crashing the application.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App-wide sender email (used by EmailService)
app.mail.sender-email=${MAIL_USERNAME:}
app.mail.sender-name=Faculty Sync Tracker

# ============================================================
# File Upload Configuration
# Override with UPLOAD_DIR environment variable in Linux/Docker environments.
# Defaults to dedicated C:/FacultyAttendance/uploads/profile-pictures on Windows.
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:C:/FacultyAttendance/uploads/profile-pictures}

# ============================================================
# Orphaned profile-photo cleanup (FILE-04)
# DESTRUCTIVE DELETION IS DISABLED BY DEFAULT: the scheduled sweep and the
# developer POST /developer/photo-cleanup/run endpoint are DRY-RUN (scan +
# report only) until this property is explicitly set to true in production.
# Candidates eligible for deletion must be: (a) unreferenced by ANY user
# record, (b) older than app.photo-cleanup.retention-hours, and (c) named in
# the server-generated pattern set — all other files are only reported.
# ============================================================
app.photo-cleanup.cron=0 0 4 * * *
app.photo-cleanup.deletion-enabled=false
app.photo-cleanup.retention-hours=24

# ============================================================
# Leave Approval Token Configuration
# ============================================================
app.leave.token.expiry-hours=72
# Annual leave entitlements enforced SERVER-SIDE in LeaveService.applyLeave
# (matching the Leave Balance page). Types without a configured quota
# (MEDICAL, OD, MATERNITY, PATERNITY) are not capped.
app.leave.quotas.casual=12
app.leave.quotas.sick=10
app.leave.quotas.earned=15
# Override APPROVAL_BASE_URL in production so email links point at the real
# backend instead of localhost.
app.leave.approval-base-url=${APPROVAL_BASE_URL:http://localhost:8081/api/leave/approve}

# ============================================================
# Frontend URL (for email links)
# ============================================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


# ============================================================
# Attendance Configuration
# ============================================================
app.attendance.late-threshold-minutes=15
app.attendance.cutoff-hour=18

# ============================================================
# College Location (for geolocation verification)
# Configure canonical campus latitude and longitude via environment variables.
# ============================================================
app.college.latitude=${COLLEGE_LATITUDE:12.9716}
app.college.longitude=${COLLEGE_LONGITUDE:77.5946}
app.college.radius-meters=${COLLEGE_RADIUS_METERS:1000}
app.college.max-accuracy-meters=${COLLEGE_MAX_ACCURACY_METERS:150}

# ============================================================
# Verification-ticket cleanup scheduler
# Production default is 60 seconds (enforced by the fallback in
# @Scheduled(fixedRateString = "${app.verification-ticket.purge-rate-ms:60000}")).
# Unset/commented here; override only for ops tuning or
# short-interval live-scheduler tests.
# ============================================================
#app.verification-ticket.purge-rate-ms=60000

# ============================================================
# Face Verification Service (Python microservice)
# ============================================================
face-verification.service-url=${FACE_VERIFICATION_SERVICE_URL:http://localhost:5001}
face-verification.internal-secret=${INTERNAL_SERVICE_SECRET:}
face-verification.connect-timeout-ms=${FACE_CONNECT_TIMEOUT_MS:5000}
face-verification.read-timeout-ms=${FACE_READ_TIMEOUT_MS:15000}

# ============================================================
# First-time activation / password-reset email throttle
# ============================================================
app.activation.resend-max-attempts=${ACTIVATION_RESEND_MAX_ATTEMPTS:5}
app.activation.resend-window-minutes=${ACTIVATION_RESEND_WINDOW_MINUTES:10}

# ============================================================
# Public self-service Forgot Password
# Reset links reuse the hashed setup-token infrastructure.
# Throttle floor (in code, uniform for known/unknown emails):
# 3 requests per email per 15 minutes.
# ============================================================
app.password-reset.token-expiry-hours=${PASSWORD_RESET_TOKEN_EXPIRY_HOURS:24}

# ============================================================
# Baseline Account Seeding
# Supply strong bootstrap passwords in your environment:
# DEVELOPER_SEED_PASSWORD, ADMIN_SEED_PASSWORD, FACULTY_SEED_PASSWORD.
# ============================================================
app.developer.email=${DEVELOPER_SEED_EMAIL:admin@college.edu}
app.developer.password=${DEVELOPER_SEED_PASSWORD:}
app.developer.employee-id=${DEVELOPER_SEED_EMPLOYEE_ID:DEV001}

app.admin.email=${ADMIN_SEED_EMAIL:hod.cse@college.edu}
app.admin.password=${ADMIN_SEED_PASSWORD:}
app.admin.employee-id=${ADMIN_SEED_EMPLOYEE_ID:HOD001}

app.faculty.email=${FACULTY_SEED_EMAIL:faculty@college.edu}
app.faculty.password=${FACULTY_SEED_PASSWORD:}
app.faculty.employee-id=${FACULTY_SEED_EMPLOYEE_ID:FAC001}

# ============================================================
# Logging
# ============================================================
logging.level.com.college.attendance=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.web.mail=DEBUG
