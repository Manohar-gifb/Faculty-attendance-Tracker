# ============================================================
# College Faculty Attendance & Management System
# Production Application Profile (application-prod.properties)
#
# Activated via: SPRING_PROFILES_ACTIVE=prod
# Strict fail-closed configuration: requires explicit environment variables.
# Verified by: com.college.attendance.config.ProductionSecurityValidator
# ============================================================

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/api

# Production Security & Error Response Hardening
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ============================================================
# Database Configuration (MySQL 8.0)
# In production, credentials MUST be provided via environment variables.
# ddl-auto defaults to 'validate' so Hibernate never modifies the schema in production.
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate - Production Safety
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Flyway Database Migrations (Safe Adoption)
# Enabled only when an operator sets FLYWAY_ENABLED=true.
# For existing live databases, baseline-on-migrate=true treats
# existing schema as baseline V1 and applies only V2+ incrementally.
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing ddl-auto=update schema (pre-Flyway era)
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# JWT Security
# Must be an external 256-bit cryptographically strong secret.
# ProductionSecurityValidator refuses to boot if this is missing or uses the dev default.
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=faculty-backend

# ============================================================
# Biometric Face Verification Microservice
# Communicates internally over Docker private network (http://face-service:5001)
# ============================================================
face-verification.service-url=${FACE_VERIFICATION_SERVICE_URL:http://face-service:5001}
face-verification.internal-secret=${INTERNAL_SERVICE_SECRET}
face-verification.connect-timeout-ms=${FACE_CONNECT_TIMEOUT_MS:5000}
face-verification.read-timeout-ms=${FACE_READ_TIMEOUT_MS:15000}

# ============================================================
# File Storage & Profile Pictures
# Mounted persistently in Docker at /var/faculty/uploads/profile-pictures
# ============================================================
app.upload.dir=${UPLOAD_DIR:/var/faculty/uploads/profile-pictures}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Photo cleanup: scheduled daily sweep at 4:00 AM (dry-run unless explicitly enabled)
app.photo-cleanup.cron=0 0 4 * * *
app.photo-cleanup.deletion-enabled=${PHOTO_CLEANUP_DELETION_ENABLED:false}
app.photo-cleanup.retention-hours=24

# ============================================================
# Email & Notification Settings (SMTP)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.sender-email=${MAIL_USERNAME:}
app.mail.sender-name=${MAIL_SENDER_NAME:Faculty Sync Tracker}

# Frontend URL (for email links)
app.frontend.url=${FRONTEND_URL}
app.leave.approval-base-url=${APPROVAL_BASE_URL:${app.frontend.url}/leave}

# ============================================================
# Production Logging
# ============================================================
logging.level.com.college.attendance=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.web.mail=INFO
logging.level.org.hibernate=WARN
