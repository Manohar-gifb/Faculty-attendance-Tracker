# ============================================================
# Faculty Sync Tracker (Formerly College Faculty Attendance System)
# Production Docker Compose Orchestration Manifest
# ============================================================

services:
  # ------------------------------------------------------------
  # 1. Database Service (MySQL 8.0)
  # Internal-only: port is NOT published to the host machine.
  # ------------------------------------------------------------
  db:
    image: mysql:8.0.36
    container_name: faculty_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-college_attendance}
      MYSQL_USER: ${DB_USERNAME:-faculty_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - faculty-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ------------------------------------------------------------
  # 2. Biometric Face Verification Microservice (Python / Flask)
  # Internal-only: isolated on faculty-net private bridge network.
  # ------------------------------------------------------------
  face-service:
    build:
      context: ./face_verification
      dockerfile: Dockerfile
    image: faculty-face-service:1.0.0
    container_name: faculty_face_service
    restart: unless-stopped
    environment:
      PORT: 5001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      UPLOAD_DIR: /app/uploads/profile-pictures
      FLASK_ENV: production
    volumes:
      # Mount profile photos volume in read-only mode for facial matching
      - uploads_data:/app/uploads/profile-pictures:ro
    networks:
      - faculty-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ------------------------------------------------------------
  # 3. Application Backend (Java 17 / Spring Boot 3.2.5)
  # Internal-only: traffic arrives via frontend Nginx reverse proxy.
  # ------------------------------------------------------------
  backend:
    build:
      context: ./facultybackend
      dockerfile: Dockerfile
    image: faculty-backend:1.0.0
    container_name: faculty_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      face-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-college_attendance}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-faculty_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      FACE_VERIFICATION_SERVICE_URL: http://face-service:5001
      UPLOAD_DIR: /var/faculty/uploads/profile-pictures
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      DDL_AUTO: ${DDL_AUTO:-validate}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
    volumes:
      # Persistent upload directory for faculty profile pictures
      - uploads_data:/var/faculty/uploads/profile-pictures
    networks:
      - faculty-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ------------------------------------------------------------
  # 4. Frontend & Reverse Proxy (React / Vite / Nginx)
  # The ONLY externally published entry point in production.
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: faculty-frontend:1.0.0
    container_name: faculty_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - faculty-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ============================================================
# Persistent Storage Volumes
# ============================================================
volumes:
  # Stores MySQL database files across container restarts & rebuilds
  mysql_data:
    name: faculty_mysql_data
  # Stores uploaded faculty profile pictures across container restarts
  uploads_data:
    name: faculty_uploads_data

# ============================================================
# Isolated Private Network
# ============================================================
networks:
  faculty-net:
    name: faculty_network
    driver: bridge
